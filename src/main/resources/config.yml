# ===================================================
#               CappyShards Configuration
# ===================================================

storage:
  type: SQLITE # Currently strictly using SQLite as requested
  file: "cappyshards.db"

anti-alt:
  enabled: true
  max-accounts-per-ip: 3

anti-vpn:
  enabled: true
  # Check IP using proxycheck.io or similar. Replace %ip% with player ip
  api-url: "http://proxycheck.io/v2/%ip%?vpn=1&asn=1"
  # JSON key to check for VPN status (e.g. "proxy": "yes")
  check-key: "proxy"
  check-value: "yes"

afk-settings:
  enabled: true
  interval-seconds: 60
  enabled-worlds:
    - "ShardAFK"
  actionbar-message: "<yellow>Receiving Shards in: <white>%time%s</white></yellow>"
  actionbar-reward-message: "<green>You received %amount% Shards for being AFK!</green>"

# Ranks are checked from top to bottom. The first one the player has permission for will be applied.
# Offline accumulation is enabled per rank using max-offline-hours and offline-permission.
# Permissions: cappy.offline.shard.<rank> or base cappy.offline.shard + rank permission.
ranks:
  vip_plus:
    permission: "cappyshards.rank.vipplus"
    offline-permission: "cappy.offline.shard.vipplus"
    amount: 50
    max-offline-hours: 12.0
  vip:
    permission: "cappyshards.rank.vip"
    offline-permission: "cappy.offline.shard.vip"
    amount: 30
    max-offline-hours: 6.0
  default:
    permission: "cappyshards.rank.default"
    amount: 10
    max-offline-hours: 0.0 # Default rank does not accumulate shards offline
