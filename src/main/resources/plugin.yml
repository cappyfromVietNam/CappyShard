name: CappyShards
version: '${version}'
main: com.cappy.shards.CappyShards
api-version: '1.21'
author: Cappy Community
description: Advanced Shards System for Paper Minecraft Servers
softdepend: [PlaceholderAPI]

commands:
  cappyshard:
    description: Main command for CappyShards
    aliases: [shard, shards, cshard, cappy]
    permission: cappyshards.use
  shardshop:
    description: Open the shard shop
    permission: cappyshards.use.shop

permissions:
  cappyshards.use:
    description: Allows basic use of commands
    default: true
  cappyshards.admin:
    description: Admin commands for CappyShards
    default: op
  cappyshards.use.pay:
    description: Allows paying shards
    default: true
  cappyshards.use.shop:
    description: Allows opening shop
    default: true
  cappyshards.bypass.zone:
    description: Bypass AFK zone requirement
    default: op
  cappy.offline.shard:
    description: Base permission to accumulate shards while offline
    default: false
  cappy.offline.shard.vipplus:
    description: Offline shard accumulation for VIP+ rank
    default: false
  cappy.offline.shard.vip:
    description: Offline shard accumulation for VIP rank
    default: false
  cappy.offline.shard.default:
    description: Offline shard accumulation for default rank
    default: false
